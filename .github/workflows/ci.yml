name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p mdcraft -p mdcraft-cli
      - uses: actions/upload-artifact@v4
        with:
          name: mdcraft-${{ runner.os }}
          path: |
            target/release/mdcraft
            target/release/mdcraft-cli
            target/release/mdcraft.exe
            target/release/mdcraft-cli.exe
